[project]
name = "wolgeup-itda"
version = "0.1.0"
description = "월급잇다 Python agent and backend integration contracts"
requires-python = ">=3.14,<3.15"
dependencies = [
  "langgraph==1.2.8",
  "langchain-openai==1.3.3",
  "langchain-core==1.4.8",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "pypdf>=6,<7",
  "reportlab>=4,<5",
  "pillow>=12,<13",
  "olefile==0.47",
  "tzdata>=2026.1",
  "pypdfium2==5.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "jsonschema>=4,<5",
    "ruff>=0.15,<1",
    "playwright>=1,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest-tmp"
markers = [
  "private_corpus: requires the original validation documents and cached evaluation results",
  "real_ocr: uses the installed local OCR engine instead of the deterministic test adapter",
]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

